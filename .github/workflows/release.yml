name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Calculate release version
        id: release
        shell: bash
        run: |
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          version="0.1.1-${GITHUB_RUN_NUMBER}-${short_sha}"
          artifact_suffix="${GITHUB_RUN_NUMBER}-${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=${artifact_suffix}" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_COMMIT_SHA: ${{ steps.release.outputs.short_sha }}
          VITE_APP_VERSION: ${{ steps.release.outputs.version }}
        with:
          tagName: v${{ steps.release.outputs.version }}
          releaseName: Typist v${{ steps.release.outputs.version }}
          releaseBody: Automated release for commit ${{ steps.release.outputs.short_sha }}. Artifact filenames use the suffix ${{ steps.release.outputs.artifact_suffix }}.
          assetNamePattern: Typist-${{ steps.release.outputs.artifact_suffix }}-[platform]-[arch][ext]
          includeUpdaterJson: false
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
